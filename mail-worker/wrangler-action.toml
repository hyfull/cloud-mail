name = "${NAME}"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[routes]]
pattern = "${CUSTOM_DOMAIN}"
custom_domain = true

[[routes]]
pattern = "${SECONDARY_CUSTOM_DOMAIN}"
custom_domain = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "${D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "kv"
id = "${KV_NAMESPACE_ID}"

[[r2_buckets]]
binding = "r2"
bucket_name = "${R2_BUCKET_NAME}"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
ai_model = "${AI_MODEL}"
analysis_cache = "${ANALYSIS_CACHE}"
#orm_log = false
domain = "${DOMAIN}"
admin = "${ADMIN}"
store_mailbox_owner = "${STORE_MAILBOX_OWNER}"
jwt_secret = "${JWT_SECRET}"
project_link = "${PROJECT_LINK}"
identity_mail_domain = "${IDENTITY_MAIL_DOMAIN}"
email_routing_domain = "${EMAIL_ROUTING_DOMAIN}"
email_routing_zone_id = "${EMAIL_ROUTING_ZONE_ID}"
email_routing_worker = "${EMAIL_ROUTING_WORKER}"
OIDC_ISSUER_URL = "${OIDC_ISSUER_URL}"
OIDC_CLIENT_ID = "${OIDC_CLIENT_ID}"
OIDC_REDIRECT_URI = "${OIDC_REDIRECT_URI}"
OIDC_REDIRECT_URI_ALT = "${OIDC_REDIRECT_URI_ALT}"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
