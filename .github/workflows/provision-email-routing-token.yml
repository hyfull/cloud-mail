name: Provision email routing token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZONE_ID: ${{ vars.EMAIL_ROUTING_ZONE_ID || 'ab0a44fa1ff0c6059fddb8a8d4221bc9' }}
      WORKER_NAME: ${{ vars.EMAIL_ROUTING_WORKER || 'cloud-mail' }}
      TOKEN_NAME: cloud-mail email routing

    steps:
      - name: Create scoped token and install Worker secret
        shell: bash
        run: |
          set -Eeuo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          created_token_id=''
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ] && [ -n "$created_token_id" ]; then
              curl --fail --silent --show-error -X DELETE -H "$auth" \
                "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/$created_token_id" >/dev/null || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          groups=$(curl --fail --silent --show-error -H "$auth" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/permission_groups")
          permission_id=$(jq -er '.result[] | select(.name == "Email Routing Rules Write") | .id' \
            <<< "$groups" | head -n 1)

          existing=$(curl --fail --silent --show-error -H "$auth" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens?per_page=100")
          old_ids=$(jq -r --arg name "$TOKEN_NAME" \
            '.result[] | select(.name == $name) | .id' <<< "$existing")

          body=$(jq -n \
            --arg name "$TOKEN_NAME" \
            --arg permission_id "$permission_id" \
            --arg resource "com.cloudflare.api.account.zone.$ZONE_ID" \
            '{name: $name, policies: [{effect: "allow", permission_groups: [{id: $permission_id}], resources: {($resource): "*"}}]}')
          created=$(curl --fail --silent --show-error -X POST -H "$auth" \
            -H 'Content-Type: application/json' --data "$body" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens")
          created_token_id=$(jq -er '.result.id' <<< "$created")
          email_routing_token=$(jq -er '.result.value' <<< "$created")
          echo "::add-mask::$email_routing_token"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $email_routing_token" \
            "$api/zones/$ZONE_ID/email/routing/rules?per_page=1" >/dev/null
          printf '%s' "$email_routing_token" | npx --yes wrangler@4.90.0 secret put \
            EMAIL_ROUTING_API_TOKEN --name "$WORKER_NAME"

          created_token_id=''
          for old_id in $old_ids; do
            curl --fail --silent --show-error -X DELETE -H "$auth" \
              "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/$old_id" >/dev/null || \
              echo "::warning::Unable to remove previous scoped token $old_id"
          done

          echo 'Scoped email routing token installed.'
